<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kết quả thi - TOEIC NTU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f7f6; }
        .result-card {
            border-radius: 20px; border: none;
            background: white;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            text-align: center; padding: 40px 20px;
        }
        .score-circle {
            width: 150px; height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 3rem; font-weight: bold;
            margin: 0 auto 20px auto;
            box-shadow: 0 10px 20px rgba(13, 110, 253, 0.3);
        }
        .stat-box { background-color: #f8f9fa; border-radius: 15px; padding: 15px; }
    </style>
</head>
<body class="d-flex align-items-center" style="min-height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card result-card">
                    <i class="bi bi-trophy-fill text-warning mb-3" style="font-size: 4rem;"></i>
                    <h3 class="fw-bold mb-1">Hoàn Thành Bài Thi!</h3>
                    <p class="text-muted mb-4" th:text="${result.exam.title}">Tên đề thi</p>

                    <div class="score-circle">
                        <span th:text="${result.score}">0</span>
                    </div>
                    <p class="fw-bold text-primary mb-4">ĐIỂM TỔNG</p>

                    <div class="row g-3 mb-4 text-start">
                        <div class="col-6">
                            <div class="stat-box">
                                <small class="text-muted d-block fw-bold"><i class="bi bi-headphones me-1"></i> NGHE</small>
                                <span class="fs-5 fw-bold text-dark" th:text="${result.correctListening}">0</span> câu đúng
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="stat-box">
                                <small class="text-muted d-block fw-bold"><i class="bi bi-book me-1"></i> ĐỌC</small>
                                <span class="fs-5 fw-bold text-dark" th:text="${result.correctReading}">0</span> câu đúng
                            </div>
                        </div>
                    </div>

                    <a th:href="@{/dashboard}" class="btn btn-outline-primary w-100 fw-bold py-2 rounded-pill">
                        <i class="bi bi-house-door-fill me-2"></i>Về Bảng Điều Khiển
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
