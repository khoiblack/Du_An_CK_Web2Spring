<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bảng điều khiển - TOEIC NTU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f7f6; }
        .header-banner {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            color: white; border-radius: 15px; padding: 2.5rem; margin-top: 2rem; margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(13, 110, 253, 0.2);
        }
        .exam-card { 
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
            border-radius: 15px; border: none; 
        }
        .exam-card:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 12px 20px rgba(0,0,0,0.1) !important; 
        }
    </style>
</head>
<body>

<div class="container pb-5">
    <div class="header-banner d-flex justify-content-between align-items-center">
        <div>
            <h2 class="fw-bold">Xin chào, <span th:text="${user.fullName}">Học viên</span>! 👋</h2>
            <p class="mb-0 fs-5 opacity-75">Sẵn sàng chinh phục mục tiêu TOEIC hôm nay chưa?</p>
        </div>
        <a th:href="@{/logout}" class="btn btn-light btn-lg text-danger fw-bold shadow-sm">
            <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
        </a>
    </div>

    <h4 class="fw-bold text-secondary mb-4"><i class="bi bi-journal-text me-2"></i>Danh sách đề thi sẵn sàng</h4>
    <div class="row">
        <div class="col-md-4 mb-4" th:each="exam : ${exams}">
            <div class="card exam-card shadow-sm h-100">
                <div class="card-body p-4 d-flex flex-column">
                    <div class="d-flex align-items-center mb-3">
                        <div class="bg-primary bg-opacity-10 text-primary p-3 rounded-circle me-3">
                            <i class="bi bi-file-earmark-check fs-3"></i>
                        </div>
                        <h5 class="card-title fw-bold text-dark mb-0" th:text="${exam.title}">Tên Đề Thi</h5>
                    </div>
                    <p class="card-text text-muted flex-grow-1" th:text="${exam.description}">Mô tả ngắn...</p>
                    <a th:href="@{'/lam-bai/' + ${exam.id}}" class="btn btn-primary w-100 fw-bold mt-2 py-2">
                        <i class="bi bi-play-circle-fill me-2"></i>Bắt đầu làm bài
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
