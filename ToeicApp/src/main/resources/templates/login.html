<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập hệ thống TOEIC - NTU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4 text-primary">TOEIC PORTAL</h3>
                        
                        <div th:if="${error}" class="alert alert-danger p-2 small text-center" th:text="${error}"></div>

                        <form th:action="@{/login}" th:object="${loginData}" method="post">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Tên đăng nhập</label>
                                <input type="text" th:field="*{username}" class="form-control" required placeholder="Nhập username...">
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-bold">Mật khẩu</label>
                                <input type="password" th:field="*{password}" class="form-control" required placeholder="Nhập mật khẩu...">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Đăng Nhập</button>
                        </form>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
