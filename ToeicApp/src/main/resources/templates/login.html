<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập hệ thống TOEIC - NTU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            
            background: linear-gradient(135deg, #f4f7f6 0%, #e0eafc 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border-radius: 20px;
            border: none;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden; 
        }
        .login-header {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            color: white;
            padding: 35px 20px;
            text-align: center;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-left: none; 
        }
        .form-control:focus {
            background-color: #fff;
            border-color: #86b7fe;
            box-shadow: none; 
        }
        .input-group-text {
            border-radius: 10px 0 0 10px;
            background-color: transparent;
            border: 1px solid #e9ecef;
            border-right: none;
            color: #0d6efd;
            padding-left: 15px;
        }
       
        .input-group:focus-within .input-group-text,
        .input-group:focus-within .form-control {
            border-color: #86b7fe;
        }
        .btn-login {
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            border: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(13, 110, 253, 0.3);
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-8 col-md-6 col-lg-5 col-xl-4">
                <div class="card login-card">
                    
                    <div class="login-header">
                        <i class="bi bi-mortarboard-fill mb-2 d-block" style="font-size: 3.5rem;"></i>
                        <h3 class="fw-bold mb-1">TOEIC PORTAL</h3>
                        <p class="mb-0 opacity-75 small">Hệ thống ôn luyện & thi thử NTU</p>
                    </div>

                    <div class="card-body p-4 p-sm-5">
                        <div th:if="${error}" class="alert alert-danger d-flex align-items-center rounded-3 p-3 mb-4 border-0" style="background-color: #fee2e2; color: #dc2626;" role="alert">
                            <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2 fs-5"></i>
                            <div class="small fw-medium" th:text="${error}">Tài khoản hoặc mật khẩu sai</div>
                        </div>

                        <form th:action="@{/login}" th:object="${loginData}" method="post">
                            <div class="mb-4">
                                <label class="form-label small fw-bold text-secondary mb-1">Tên đăng nhập</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                                    <input type="text" th:field="*{username}" class="form-control" required placeholder="Nhập username...">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-bold text-secondary mb-1">Mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" th:field="*{password}" class="form-control" required placeholder="Nhập mật khẩu...">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-login w-100 text-white mt-2">
                                ĐĂNG NHẬP <i class="bi bi-arrow-right-circle-fill ms-2"></i>
                            </button>
                        </form>
                        
                        <div class="text-center mt-4 pt-2 border-top">
                            <small class="text-muted">Chưa có tài khoản? <a href="#" class="text-decoration-none fw-bold text-primary">Đăng ký ngay</a></small>
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
