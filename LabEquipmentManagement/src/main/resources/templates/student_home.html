<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sinh viên - Đăng Ký Mượn Phòng Máy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Cổng Sinh Viên - Thực Hành IT</a>
            <div class="d-flex">
                <span class="navbar-text text-white me-3" th:text="'Sinh viên: ' + ${session.currentUser.fullName}"></span>
                <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Đăng xuất</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="text-end mb-4">
            <button class="btn btn-success btn-lg shadow-sm" data-bs-toggle="modal" data-bs-target="#bookingModal">
                📝 Tạo Phiếu Đăng Ký Mượn
            </button>
        </div>

        <div class="card shadow-sm mb-5">
            <div class="card-header bg-white fw-bold text-secondary">Lịch Sử Yêu Cầu Đăng Ký Của Bạn</div>
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Mã Phiếu</th>
                            <th>Phòng Máy</th>
                            <th>Thiết Bị Mượn</th>
                            <th>Số Lượng</th>
                            <th>Thời Gian Bắt Đầu</th>
                            <th>Thời Gian Kết Thúc</th>
                            <th>Trạng Thái</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="b : ${myBookings}">
                            <td th:text="${b.id}"></td>
                            <td th:text="${b.labRoom != null ? b.labRoom.roomName : 'Không mượn phòng'}"></td>
                            <td th:text="${b.equipment != null ? b.equipment.name : 'Không mượn thiết bị'}"></td>
                            <td th:text="${b.quantity}"></td>
                            <td th:text="${#temporals.format(b.startTime, 'dd-MM-yyyy HH:mm')}"></td>
                            <td th:text="${#temporals.format(b.endTime, 'dd-MM-yyyy HH:mm')}"></td>
                            <td>
                                <span th:if="${b.status == 'PENDING'}" class="badge bg-warning text-dark">Chờ Duyệt</span>
                                <span th:if="${b.status == 'APPROVED'}" class="badge bg-success">Đã Phê Duyệt</span>
                                <span th:if="${b.status == 'REJECTED'}" class="badge bg-danger">Từ Chối</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(myBookings)}">
                            <td colspan="7" class="text-center text-muted py-4">Bạn chưa tạo phiếu đăng ký mượn nào.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="bookingModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form th:action="@{/student/booking/save}" method="POST" th:object="${newBooking}" onsubmit="return validateForm()">
                    <div class="modal-header bg-light">
                        <h5 class="modal-title" id="modalTitle">Tạo Yêu Cầu Mượn Phòng Máy / Thiết Bị</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Chọn Phòng Máy (Nếu có mượn phòng)</label>
                                <select name="roomId" class="form-select">
                                    <option value="0">-- Không mượn phòng (Chỉ mượn thiết bị rời) --</option>
                                    <option th:each="r : ${listRooms}" 
                                            th:value="${r.id}" 
                                            th:text="'🏫 ' + ${r.roomName} + ' (Sức chứa: ' + ${r.capacity} + ')'" 
                                            th:disabled="${r.status == 'MAINTENANCE'}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Chọn Thiết Bị Mang Đi (Nếu có mượn thiết bị)</label>
                                <select id="equipmentSelect" name="equipmentId" class="form-select">
                                    <option value="0" data-available="999999">-- Không mượn thiết bị rời (Chỉ mượn phòng) --</option>
                                    <option th:each="e : ${listEquipment}" 
                                            th:value="${e.id}" 
                                            th:data-available="${e.availableQuantity}"
                                            th:text="'🔌 ' + ${e.name} + ' (Sẵn có: ' + ${e.availableQuantity} + ')'" 
                                            th:disabled="${e.availableQuantity == 0}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Số lượng thiết bị cần mượn</label>
                                <input type="number" name="quantity" class="form-control" th:field="*{quantity}" min="1" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Mục đích sử dụng tài nguyên</label>
                                <input type="text" name="purpose" class="form-control" th:field="*{purpose}" required placeholder="Ví dụ: Thực hành nhóm đồ án...">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Thời gian bắt đầu mượn</label>
                                <input type="datetime-local" id="startTime" name="startTime" class="form-control" th:field="*{startTime}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Thời gian trả dự kiến</label>
                                <input type="datetime-local" id="endTime" name="endTime" class="form-control" th:field="*{endTime}" required>
                            </div>
                        </div>

                        <div id="errorAlert" class="alert alert-danger d-none mt-3" role="alert"></div>

                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                        <button type="submit" class="btn btn-primary">Gửi Yêu Cầu Duyệt</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
    function validateForm() {
        const startVal = document.getElementById('startTime').value;
        const endVal = document.getElementById('endTime').value;
        const errorAlert = document.getElementById('errorAlert');
        
        const quantityInput = document.getElementsByName('quantity')[0];
        const inputQuantity = parseInt(quantityInput.value) || 0;

        const eqSelect = document.getElementById('equipmentSelect');
        const selectedOption = eqSelect.options[eqSelect.selectedIndex];
        
        const maxAvailable = parseInt(selectedOption.getAttribute('data-available')) || 0;

        // Bắt lỗi số lượng
        if (inputQuantity > maxAvailable) {
            errorAlert.innerText = "Số lượng thiết bị mượn (" + inputQuantity + ") vượt quá số lượng sẵn có trong kho (" + maxAvailable + ")!";
            errorAlert.classList.remove('d-none');
            return false;
        }

        // Bắt lỗi ngày tháng
        if (startVal && endVal) {
            const startDate = new Date(startVal);
            const endDate = new Date(endVal);
            const now = new Date();

            if (startDate < now) {
                errorAlert.innerText = "Thời gian mượn không được nằm trong quá khứ!";
                errorAlert.classList.remove('d-none');
                return false;
            }
            if (endDate <= startDate) {
                errorAlert.innerText = "Thời gian trả dự kiến phải sau thời gian bắt đầu mượn!";
                errorAlert.classList.remove('d-none');
                return false;
            }
        }
        errorAlert.classList.add('d-none');
        return true;
    }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
