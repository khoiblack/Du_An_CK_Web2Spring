<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký Tài Khoản Sinh Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .register-card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .bg-gradient-primary {
            background: linear-gradient(135deg, #0d6efd 0%, #0dcaf0 100%);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card register-card border-0">
                <div class="card-header bg-gradient-primary text-white text-center py-4">
                    <h4 class="mb-0"><i class="fa-solid fa-user-graduate me-2"></i> Đăng Ký Sinh Viên</h4>
                    <small>Cổng thông tin mượn trả phòng máy</small>
                </div>
                <div class="card-body p-4 p-md-5">
                    
                    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

                    <form th:action="@{/register/save}" method="POST" th:object="${newUser}">
                        
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label fw-bold">Mã SV (MSSV)</label>
                                <input type="text" name="studentId" th:field="*{studentId}" class="form-control" required placeholder="VD: 63131234">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label fw-bold">Lớp Sinh Hoạt</label>
                                <input type="text" name="studentClass" th:field="*{studentClass}" class="form-control" required placeholder="VD: 63.CNTT-1">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Họ và Tên Sinh Viên</label>
                            <input type="text" name="fullName" th:field="*{fullName}" class="form-control" required placeholder="Nhập đầy đủ họ tên...">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Tên Đăng Nhập</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                                <input type="text" name="username" th:field="*{username}" class="form-control" required placeholder="Tạo tên đăng nhập...">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Mật Khẩu</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" name="password" th:field="*{password}" class="form-control" required placeholder="Tạo mật khẩu...">
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold">Tạo Tài Khoản Ngay</button>
                        </div>
                    </form>
                    
                    <hr class="mt-4 mb-3">
                    <div class="text-center">
                        <span class="text-muted">Đã có tài khoản?</span> 
                        <a th:href="@{/login}" class="text-decoration-none fw-bold">Quay lại Đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
