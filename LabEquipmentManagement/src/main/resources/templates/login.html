<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập hệ thống</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; }
        .login-card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card login-card border-0" style="width: 400px;">
        <div class="card-body p-4 p-md-5">
            
            <div class="text-center mb-4">
                <i class="fa-solid fa-laptop-code fa-3x text-primary mb-3"></i>
                <h4 class="card-title text-primary fw-bold">Cổng Thực Hành IT</h4>
            </div>
            
            <div th:if="${error}" class="alert alert-danger text-center shadow-sm" role="alert">
                <i class="fa-solid fa-triangle-exclamation me-1"></i> <span th:text="${error}"></span>
            </div>
            
            <div th:if="${param.registerSuccess != null}" class="alert alert-success text-center shadow-sm" role="alert">
                <i class="fa-solid fa-circle-check me-1"></i> Đăng ký thành công!<br>Hãy đăng nhập ngay.
            </div>
            
            <form th:action="@{/login}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Tên tài khoản</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" name="username" class="form-control" required placeholder="Nhập tên đăng nhập...">
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-bold">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" name="password" class="form-control" required placeholder="Nhập mật khẩu...">
                    </div>
                </div>
                
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold">Đăng Nhập</button>
                </div>
            </form>

            <hr class="mt-4 mb-3">
            <div class="text-center">
                <span class="text-muted">Chưa có tài khoản?</span> 
                <a th:href="@{/register}" class="text-decoration-none fw-bold text-primary">Đăng ký ngay</a>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
