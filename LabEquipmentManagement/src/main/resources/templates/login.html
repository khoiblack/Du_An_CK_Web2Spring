<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập hệ thống</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow" style="width: 400px;">
        <div class="card-body">
            <h3 class="card-title text-center mb-4 text-primary">Hệ Thống Quản Lý Phòng Máy IT</h3>
            
            <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>
            
            <form th:action="@{/login}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Tên tài khoản</label>
                    <input type="text" name="username" class="form-core form-control" required placeholder="Nhập admin hoặc sinhvien1">
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" name="password" class="form-control" required placeholder="Nhập mật khẩu">
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-2">Đăng Nhập</button>
            </form>
        </div>
    </div>

</body>
</html>
