<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="html_head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Quản Trị Hệ Thống</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; }
        /* Tùy chỉnh thanh cuộn siêu đẹp */
        .main-content::-webkit-scrollbar { width: 6px; }
        .main-content::-webkit-scrollbar-thumb { background: #adb5bd; border-radius: 10px; }
        /* Hiệu ứng Sidebar */
        .nav-pills .nav-link { transition: all 0.3s ease; border-radius: 8px; }
        .nav-pills .nav-link:hover:not(.active) { background-color: rgba(255, 255, 255, 0.1); }
        .nav-pills .nav-link.active { background-color: #0d6efd !important; font-weight: bold; box-shadow: 0 4px 6px rgba(13,110,253,0.3); }
    </style>
</head>

<body>

    <div th:fragment="sidebar" class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark shadow-lg" style="width: 280px; z-index: 1000; height: 100vh; position: fixed; top: 0; left: 0;">
        
        <div class="d-flex align-items-center mb-4 mt-2 me-md-auto text-white px-2">
            <i class="fa-solid fa-server fa-2x text-warning me-3"></i>
            <span class="fs-5 fw-bold" style="letter-spacing: 1px;">IT LAB ADMIN</span>
        </div>
        
        <hr class="text-secondary border-2 opacity-50">
        
        <ul class="nav nav-pills flex-column mb-auto gap-2" id="v-pills-tab" role="tablist">
            
            <li class="nav-item">
                <button class="nav-link active text-white w-100 text-start d-flex align-items-center border-0" id="v-pills-rooms-tab" data-bs-toggle="pill" data-bs-target="#v-pills-rooms" type="button" role="tab">
                    <i class="fa-solid fa-house-laptop me-3 w-20px text-center text-info"></i> Quản Lý Phòng Máy
                </button>
            </li>
            
            <hr class="text-secondary border-1 opacity-25 my-1">

            <li class="nav-item">
                <button class="nav-link text-white w-100 text-start d-flex align-items-center border-0" id="v-pills-equipment-tab" data-bs-toggle="pill" data-bs-target="#v-pills-equipment" type="button" role="tab">
                    <i class="fa-solid fa-boxes-stacked me-3 w-20px text-center text-warning"></i> Quản Lý Thiết Bị
                </button>
            </li>
            
            <hr class="text-secondary border-1 opacity-25 my-1">

            <li class="nav-item">
                <button class="nav-link text-white w-100 text-start d-flex align-items-center border-0" id="v-pills-requests-tab" data-bs-toggle="pill" data-bs-target="#v-pills-requests" type="button" role="tab">
                    <i class="fa-solid fa-clipboard-check me-3 w-20px text-center text-success"></i> Duyệt Đăng Ký
                </button>
            </li>

        </ul>
        
        <hr class="text-secondary border-2 opacity-50">
        
        <div class="dropdown mt-2 mb-2">
            <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle px-2" id="dropdownUser" data-bs-toggle="dropdown" aria-expanded="false">
                <div class="bg-secondary rounded-circle d-flex justify-content-center align-items-center me-3 shadow-sm" style="width: 38px; height: 38px;">
                    <i class="fa-solid fa-user-shield text-white"></i>
                </div>
                <div>
                    <strong class="d-block" th:text="${session.currentUser.fullName}">Tên Admin</strong>
                    <small class="text-warning fw-bold" style="font-size: 0.75rem;">QUẢN TRỊ VIÊN</small>
                </div>
            </a>
            <ul class="dropdown-menu dropdown-menu-dark text-small shadow w-100" aria-labelledby="dropdownUser">
                <li><a class="dropdown-item text-danger fw-bold py-2" th:href="@{/logout}"><i class="fa-solid fa-right-from-bracket me-2"></i>Đăng xuất</a></li>
            </ul>
        </div>
    </div>

</body>
</html>
