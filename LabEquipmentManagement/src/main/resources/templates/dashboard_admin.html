<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Quản Lý Thiết Bị</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Hệ Thống Quản Lý Phòng Máy IT</a>
            <div class="d-flex">
                <span class="navbar-text text-white me-3" th:text="'Xin chào, ' + ${session.currentUser.fullName}"></span>
                <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Đăng xuất</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Danh Sách Trang Thiết Bị Khoa</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#equipmentModal" onclick="prepareAddForm()">
                + Thêm Thiết Bị Mới
            </button>
        </div>

        <div class="card shadow">
            <div class="card-body">
                <table class="table table-hover table-striped align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Tên Thiết Bị</th>
                            <th>Danh Mục</th>
                            <th>Tổng Số Lượng</th>
                            <th>Sẵn Có</th>
                            <th class="text-center">Hành Động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${listEquipment}">
                            <td th:text="${item.id}"></td>
                            <td th:text="${item.name}" class="fw-bold"></td>
                            <td th:text="${item.category}"></td>
                            <td th:text="${item.totalQuantity}"></td>
                            <td th:text="${item.availableQuantity}" class="text-success fw-bold"></td>
                            <td class="text-center">
                                <button class="btn btn-warning btn-sm me-2" 
                                        data-bs-toggle="modal" 
                                        data-bs-target="#equipmentModal"
                                        th:data-id="${item.id}"
                                        th:data-name="${item.name}"
                                        th:data-category="${item.category}"
                                        th:data-total="${item.totalQuantity}"
                                        th:data-available="${item.availableQuantity}"
                                        onclick="prepareEditForm(this)">
                                    Sửa
                                </button>
                                <a th:href="@{/admin/equipment/delete/{id}(id=${item.id})}" 
                                   class="btn btn-danger btn-sm"
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa thiết bị này không?')">
                                    Xóa
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="equipmentModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/admin/equipment/save}" method="POST" th:object="${equipment}">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalTitle">Thêm Thiết Bị</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="formId" name="id">
                        <input type="hidden" id="formAvailable" name="availableQuantity">

                        <div class="mb-3">
                            <label class="form-label">Tên thiết bị</label>
                            <input type="text" id="formName" name="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Danh mục</label>
                            <select id="formCategory" name="category" class="form-select">
                                <option value="Network">Thiết bị Mạng (Router/Switch)</option>
                                <option value="Đồ dùng">Đồ dùng hỗ trợ (Máy chiếu/...)</option>
                                <option value="Linh kiện">Linh kiện rời (Kính VR/Phụ kiện)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tổng số lượng</label>
                            <input type="number" id="formTotal" name="totalQuantity" class="form-control" min="1" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-success" id="btnSubmit">Lưu Lại</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function prepareAddForm() {
            document.getElementById('modalTitle').innerText = "Thêm Thiết Bị Mới";
            document.getElementById('formId').value = "";
            document.getElementById('formAvailable').value = "";
            document.getElementById('formName').value = "";
            document.getElementById('formCategory').value = "Network";
            document.getElementById('formTotal').value = "";
            document.getElementById('btnSubmit').className = "btn btn-success";
            document.getElementById('btnSubmit').innerText = "Thêm Mới";
        }

        function prepareEditForm(button) {
            document.getElementById('modalTitle').innerText = "Cập Nhật Thông Tin Thiết Bị";
            
            const id = button.getAttribute('data-id');
            const name = button.getAttribute('data-name');
            const category = button.getAttribute('data-category');
            const total = button.getAttribute('data-total');
            const available = button.getAttribute('data-available');

            document.getElementById('formId').value = id;
            document.getElementById('formAvailable').value = available;
            document.getElementById('formName').value = name;
            document.getElementById('formCategory').value = category;
            document.getElementById('formTotal').value = total;
            
            document.getElementById('btnSubmit').className = "btn btn-warning";
            document.getElementById('btnSubmit').innerText = "Cập Nhật";
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
