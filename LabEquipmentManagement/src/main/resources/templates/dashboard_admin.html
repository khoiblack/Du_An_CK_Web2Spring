<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragment :: html_head('Bảng Điều Khiển Admin')}"></head>

<body>

    <div class="d-flex">
        <div th:replace="~{fragment :: sidebar}"></div>

        <div class="main-content flex-grow-1" style="margin-left: 280px; min-height: 100vh;">
            
            <div class="p-5">
                <div class="tab-content" id="v-pills-tabContent">
                    
                    <div class="tab-pane fade show active" id="v-pills-rooms" role="tabpanel">
                        <div th:replace="~{admin_rooms :: tab_content}"></div>
                    </div>

                    <div class="tab-pane fade" id="v-pills-equipment" role="tabpanel">
                        <div th:replace="~{admin_equipment :: tab_content}"></div>
                    </div>
                    
                    <div class="tab-pane fade" id="v-pills-requests" role="tabpanel">
                        <div th:replace="~{admin_requests :: tab_content}"></div>
                    </div>
                    <div class="tab-pane fade" id="v-pills-users" role="tabpanel">
                        <div th:replace="~{admin_users :: tab_content}"></div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{admin_rooms :: modal_and_js}"></div>
    <div th:replace="~{admin_equipment :: modal_and_js}"></div>
	<div th:replace="~{admin_users :: modal_and_js}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
